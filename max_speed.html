<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAX SPEEEED !!!!!!</title>
    <!-- <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script> -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
    <style>
      body {
        font-family: "Comic Sans MS", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
    </style>

    <link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
    <script type="module">
      import { makeGlobal, signal, effect, derived } from "./lib.js";

      // Rendering constants
      const ONE_SECOND_IN_MS = 1000;
      const MAX_COLOR = parseInt("FFFFFF", 16);
      const FONT_SIZE = 32;
      const BLOCK_SIZE = 20;
      const MARGIN = 10;
      const MAX_MAX_BOX_COUNT = 100_000;
      const DEFAULT_MAX_BOX_COUNT = 25_000;
      const MEASURE_INTERVAL_BOX = 100;
      const MEASURE_INTERVAL_MS = 10;
      const MAX_SAMPLES = 2_500;
      const MIN_BOX_COUNT = 0;
      const MIN_BOX_COUNT_LABEL = MIN_BOX_COUNT.toLocaleString("en");
      /** @type {Array<{x: number, y: number}>} */
      let requestBaseValue = [];
      /** @type {Array<{x: number, y: number}>} */
      let timeoutBaseValue = [];

      const requestSamples = signal(requestBaseValue);
      const timeoutSamples = signal(timeoutBaseValue);
      const maxBoxCount = signal(DEFAULT_MAX_BOX_COUNT);
      const mediumMaxBoxCount = derived(() => Math.ceil(maxBoxCount.value / 10));
      const smallMaxBoxCount = derived(() => Math.ceil(maxBoxCount.value / 100));
      const boxCount = signal(50);
      const shouldSample = signal(false);
      const autoIncr = signal(false);

      makeGlobal(
        { maxBoxCount },
        { boxCount },
        { mediumBoxCountInput },
        { smallBoxCountInput },
        { labelText },
        { labelTextMedium },
        { labelTextSmall },
        { shouldSample },
        { autoIncr }
      );

      document.addEventListener("DOMContentLoaded", () => {
        // Get our two canvases
        const {
          request,
          timeout,
          boxCountLabel,
          boxCountInput,
          mediumBoxCountInput,
          smallBoxCountInput,
          labelText,
          labelTextMedium,
          labelTextSmall,
          statistics,
          shouldSample,
          autoIncr,
          fpsCanvas,
          maxBoxCountInput,
          maxBoxCountLabel,
        } = window;

        // Init chart

        const chart = new Chart(fpsCanvas, {
          type: "scatter",
          data: {
            datasets: [
              {
                label: "requestAnimationFrame",
                data: [],
                borderColor: "rgb(54, 162, 235)",
                backgroundColor: "rgba(54, 162, 235,0.5)",
              },
              {
                label: "setTimeout(0)",
                data: [],
                borderColor: "rgb(255, 99, 132)",
                backgroundColor: "rgba(255, 99, 132,0.5)",
              },
            ],
          },
          options: {
            responsive: true,

            scales: {
              x: {
                type: "linear",
                position: "bottom",
              },
            },
          },
        });

        const updateChart = _.throttle(() => {
          console.log("samples length", requestSamples.value.length);
          chart.data.datasets.filter((it) => it.label === "requestAnimationFrame")[0].data = requestSamples.value;
          chart.data.datasets.filter((it) => it.label === "setTimeout(0)")[0].data = timeoutSamples.value;

          chart.update();
        }, 1000);

        // Hook elements to state
        effect(() => (shouldSample.checked = shouldSample.value ? "checked" : ""));
        effect(() => (autoIncr.checked = autoIncr.value ? "checked" : ""));
        // effect(() => (maxBoxCountInput.value = maxBoxCount.value));
        effect(() => (maxBoxCountLabel.textContent = maxBoxCount.value.toLocaleString("en")));

        maxBoxCountInput.max = MAX_MAX_BOX_COUNT;

        effect(() => {
          let currentRequestSamples = requestSamples.value;
          updateChart();
        });
        // subRequestSamples.value(fpsCanvas, updateChart);

        effect(() => console.log("should sample:", shouldSample.value ? "enabled" : "disabled"));
        effect(() => console.log("auto-incr:", autoIncr.value ? "enabled" : "disabled"));

        // Set minimum box count for all inputs
        boxCountInput.min = MIN_BOX_COUNT;
        mediumBoxCountInput.min = MIN_BOX_COUNT;
        maxBoxCountInput.min = MIN_BOX_COUNT;

        // Update labels and values when maxBoxCount.value changes
        effect(() => {
          let currentMaxBoxCount = maxBoxCount.value;
          labelText.textContent = `${MIN_BOX_COUNT_LABEL} to ${currentMaxBoxCount.toLocaleString("en")}`;
          boxCountInput.max = currentMaxBoxCount;
          boxCountInput.value = Math.min(currentMaxBoxCount, Number(boxCountInput.value));
          maxBoxCountInput.value = currentMaxBoxCount;
        });

        effect(() => {
          let currentMediumMaxBoxCount = mediumMaxBoxCount.value;
          labelTextMedium.textContent = `${MIN_BOX_COUNT_LABEL} to ${currentMediumMaxBoxCount.toLocaleString("en")}`;
          mediumBoxCountInput.max = currentMediumMaxBoxCount;
          mediumBoxCountInput.value = Math.min(currentMediumMaxBoxCount, Number(mediumBoxCountInput.value));
        });

        effect(() => {
          let currentSmallMaxBoxCount = smallMaxBoxCount.value;
          labelTextSmall.textContent = `${MIN_BOX_COUNT_LABEL} to ${currentSmallMaxBoxCount.toLocaleString("en")}`;
          smallBoxCountInput.max = currentSmallMaxBoxCount;
          smallBoxCountInput.value = Math.min(currentSmallMaxBoxCount, Number(smallBoxCountInput.value));
        });

        effect(() => {
          let currentBoxCount = boxCount.value;

          console.log("currentBoxCount", currentBoxCount);

          boxCountLabel.textContent = currentBoxCount.toLocaleString("en");
          boxCountInput.value = currentBoxCount;
          mediumBoxCountInput.value = currentBoxCount;
          smallBoxCountInput.value = currentBoxCount;
        });


        // Both canvas contexts for each of our rendering techniques
        const ctxRequest = request.getContext("2d");
        const ctxTimeout = timeout.getContext("2d");

        // Generic render logic from context and frame delta time
        const render = (canvasId, active, ctx, delta, nextFrame, sampler) => {
          if (active) {
            let { width, height } = ctx.canvas;

            // Draw background
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, width, height);

            // Draw some bs to make shit lag
            for (let index = 0; index < boxCount.value; index++) {
              ctx.fillStyle = `#${Math.round(Math.random() * MAX_COLOR).toString(16)}`;
              ctx.fillRect(
                Math.random() * (width - width * 0.2 - BLOCK_SIZE) + width * 0.1,
                Math.random() * (height - height * 0.2 - BLOCK_SIZE) + height * 0.1,
                BLOCK_SIZE,
                BLOCK_SIZE
              );
            }

            // Draw framerate

            let framerateValue = 0;
            if (delta !== 0) {
              // display framerate with 1 decimal place
              framerateValue = (ONE_SECOND_IN_MS / delta).toFixed(1);
            }
            let framerateText = `${framerateValue} fps`;

            // console.info("Framerate (FPS) for canvas", canvasId, ": ", framerate);

            // draw framerate
            ctx.fillStyle = "rgba(255, 255, 0, 1)";
            ctx.fillRect(MARGIN, MARGIN, FONT_SIZE * 5 + 2, FONT_SIZE + 2 * 2);

            ctx.fillStyle = "black";
            ctx.font = `${FONT_SIZE}px monospace `;
            ctx.fillText(framerateText, MARGIN, FONT_SIZE + MARGIN);
            if (shouldSample.value) {
              sampler(framerateValue, boxCount.value);
            }
          }
          nextFrame();
        };

        // Render using the `requestAnimationFrame` method
        let lastTime = 0;
        let requestSample = _.throttle((framerate, boxCount) => {
          const samples = requestSamples.value;
          if (samples.length >= MAX_SAMPLES) return;
          samples.push({ y: Math.round(framerate), x: boxCount });
          requestSamples.value = samples;
        }, MEASURE_INTERVAL_MS);
        const loopRequest = (time) => {
          // delta (in ms)
          const delta = time - lastTime;
          render(
            "requestAnimationFrame",
            window.playRequest.checked,
            ctxRequest,
            delta,
            () => requestAnimationFrame(loopRequest),
            requestSample
          );
          lastTime = time;
        };

        loopRequest(0);

        // Render using the `setTimeout` method
        let timeoutLastTime = Date.now();
        let timeoutSampler = _.throttle((framerate, boxCount) => {
          const samples = timeoutSamples.value;
          if (samples.length >= MAX_SAMPLES) return;
          samples.push({ y: Math.round(framerate), x: boxCount });
          timeoutSamples.value = samples;
        }, MEASURE_INTERVAL_MS);
        const loopTimeout = (time) => {
          let delta = time - timeoutLastTime;
          render(
            "timeout",
            window.playTimeout.checked,
            ctxTimeout,
            delta,
            () => setTimeout(() => loopTimeout(Date.now()), 0),
            timeoutSampler
          );
          timeoutLastTime = time;
        };
        loopTimeout(Date.now());

        // start box count increment step
        let interval = setInterval(() => {
          if (!autoIncr.value) return;
          boxCount.value = (boxCount.value + MEASURE_INTERVAL_BOX) % maxBoxCount.value;
        }, MEASURE_INTERVAL_MS);
      });
    </script>
  </head>
  <body class="bg-neutral-100 justify-center flex">
    <main class="mx-3 container px-4 mt-2 bg-white p-5 rounded-lg border shadow-sm">
      <h1 class="text-3xl font-bold mb-3">TESTING MAX SPEEEEED <span class="hover:scale-[4] inline-block transition"> <span class="transition hover:animate-spin inline-block">🤪</span></span></h1>
      <hr class="my-2" />
      <div>
        <p class="font-bold mb-3">
          <span class=" hover:scale-[4] inline-block transition"> <span class="transition hover:animate-pulse inline-block">🟦 </span></span>
          Box count:</p>
        <label for="boxCountInput" class="block">
          <span class="min-w-[15ch] inline-block" id="labelText">1 to 100,000</span>
          <input
            class="max-w-96 w-full"
            type="range"
            name="boxCountInput"
            id="boxCountInput"
            min="0"
            max="10000"
            step="50"
            oninput="boxCount.value = Number(this.value)"
          />
        </label>
        <label for="mediumBoxCountInput" class="block">
          <span class="min-w-[15ch] inline-block" id="labelTextMedium"> 1 to 10,000</span>
          <input
            class="max-w-96 w-full"
            type="range"
            name="mediumBoxCountInput"
            id="mediumBoxCountInput"
            min="0"
            max="100"
            step="5"
            oninput="boxCount.value = Number(this.value)"
          />
        </label>
        <label for="smallBoxCountInput" class="block">
          <span class="min-w-[15ch] inline-block" id="labelTextSmall"> 1 to 100</span>
          <input
            class="max-w-96 w-full"
            type="range"
            name="smallBoxCountInput"
            id="smallBoxCountInput"
            min="0"
            max="100"
            step="1"
            oninput="boxCount.value = Number(this.value)"
          />
        </label>
        <span class="font-bold my-3">Current box count:</span>

        <span
          class="inline-block px-2 border-2 border-emerald-200 bg-emerald-100 text-emerald-900 rounded font-bold hover:scale-110 active:scale-90 transition select-none"
          id="boxCountLabel"
          >NUMBER OF BOXES DRAWN FOR A FRAME</span
        >
        <hr class="my-2" />
        <label for="boxCount" class="block">
          <span class="min-w-[15ch] inline-block"> <span class=" hover:scale-[4] inline-block transition"> <span class="transition hover:animate-bounce inline-block">🔥</span></span> Max box count</span>
          <input
            class="max-w-96 w-full"
            type="range"
            name="maxBoxCountInput"
            id="maxBoxCountInput"
            min="0"
            max="100"
            step="50"
            oninput="maxBoxCount.value = Number(this.value)"
          />
        </label>
        Current max box count:
        <span
          class="inline-block px-2 border-2 border-emerald-200 bg-emerald-100 text-emerald-900 rounded font-bold hover:scale-110 active:scale-90 transition select-none"
          id="maxBoxCountLabel"
          >NUMBER OF BOXES DRAWN FOR A FRAME</span
        >
      </div>
      <hr class="my-2" />

      <div class="articles flex gap-3 flex-wrap">
        <article>
          <label for="playRequest" class="mb-3 text-xl">
            <input type="checkbox" name="playRequest" id="playRequest" checked="checked" />
            <code>requestAnimationFrame</code>
          </label>

          <div class="border shadow-sm p-2 rounded-sm bg-white m-2 aspect-square max-w-max">
            <canvas class="aspect-square w-full" width="500" height="500" id="request"></canvas>
          </div>
        </article>
        <article>
          <label for="playTimeout" class="mb-3 text-xl">
            <input type="checkbox" name="playTimeout" id="playTimeout" checked="checked" />
            <code>setTimeout(0)</code></label
          >
          <div class="border p-2 shadow-sm bg-white rounded-sm m-2 aspect-square max-w-max">
            <canvas class="aspect-square w-full" width="500" height="500" id="timeout"></canvas>
          </div>
        </article>
      </div>
      <hr class="my-2" />
      <div class="statistics">
        <h2 class="text-2xl font-bold mb-3">Statistics 📊</h2>
        <label for="shouldSample" class="block">
          Enable sampling:
          <input type="checkbox" name="shouldSample" id="shouldSample" oninput="shouldSample.value = this.checked" />
        </label>
        <label for="autoIncr" class="block">
          Enable auto-increment box count:
          <input type="checkbox" name="autoIncr" id="autoIncr" oninput="autoIncr.value = this.checked" />
        </label>
        <div
          class="mx-auto mb-10 bg-slate-50 p-5 rounded-lg border shadow-sm aspect-video my-3"
          id="statistics"
          style="position: relative; max-width: 100%"
        >
          <canvas id="fpsCanvas"></canvas>
        </div>
      </div>

      
    </main>
    <div class="fader w-full h-32 bg-gradient-to-t from-white to-white/0 fixed bottom-0 z-10 pointer-events-none"></div>
  </body>
</html>
