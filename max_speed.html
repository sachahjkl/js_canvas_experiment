<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAX SPEEEED !!!!!!</title>
    <!-- <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script> -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
    <style>

      body {
        font-family:"Comic Sans MS", 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
    </style>

    <link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
    <script>
      /**
       * @function
       * @template T
       * @param {T} initialValue
       */
      function makeState(initialValue) {
        let state = {
          /** @type {T} */
          value: initialValue,
          /** @type {Array<{source: HTMLElement, setter: (v: T) => void }>} */
          subscribers: [],
          /** @type {(source: HTMLElement, newValue: T) => void} */
          update: (source, newValue) => {
            state.value = newValue;
            state.subscribers
              .filter((s) => source !== s.source)
              .forEach((s) => s.setter(newValue));
          },
        };

        /**
         * @type {[ () => T, (source: HTMLElement, newValue: T) => void, (source: HTMLElement, setter: (v: T) => void) => void ]}
         */
        let stateAccess = [
          (get) => state.value,
          state.update,
          (source, setter) => state.subscribers.push({ source, setter }),
        ];
        return stateAccess;
      }

      // Rendering constants
      const ONE_SECOND_IN_MS = 1000;
      const MAX_COLOR = parseInt("FFFFFF", 16);
      const FONT_SIZE = 32;
      const BLOCK_SIZE = 20;
      const MARGIN = 10;
      const MAX_MAX_BOX_COUNT = 100_000;
      const DEFAULT_MAX_BOX_COUNT = 25_000;
      const MEASURE_INTERVAL_BOX = 100;
      const MEASURE_INTERVAL_MS = 10;
      const MAX_SAMPLES = 2_500;
      const MIN_BOX_COUNT = 0;
      /** @type {Array<{x: number, y: number}>} */
      let requestBaseValue = [];
      /** @type {Array<{x: number, y: number}>} */
      let timeoutBaseValue = [];
      const [getRequestSamples, updateRequestSamples, subRequestSamples] =
        makeState(requestBaseValue);
      const [getTimeoutSamples, updateTimeoutSamples, subTimeoutSamples] =
        makeState(timeoutBaseValue);
      const [getMaxBoxCount, updateMaxBoxCount, subMaxBoxCount] =
        makeState(MAX_MAX_BOX_COUNT);
      const [getBoxCount, updateBoxCount, subBoxCount] = makeState(50);
      const [getShouldSample, updateShouldSample, subShouldSample] =
        makeState(false);
      const [getAutoIncr, updateAutoIncr, subAutoIncr] = makeState(false);

      const getBoxCountScaledMedium = (boxCount) => boxCount / 10;

      document.addEventListener("DOMContentLoaded", () => {
        // Get our two canvases
        const {
          request,
          timeout,
          boxCountLabel,
          boxCountInput,
          labelText,
          boxCountInput2,
          labelText2,
          statistics,
          shouldSample,
          autoIncr,
          fpsCanvas,
          maxBoxCountInput,
          maxBoxCountLabel,
        } = window;

        // Init chart

        const chart = new Chart(fpsCanvas, {
          type: "scatter",
          data: {
            datasets: [
              {
                label: "requestAnimationFrame",
                data: [],
                borderColor: "rgb(54, 162, 235)",
                backgroundColor: "rgba(54, 162, 235,0.5)",
              },
              {
                label: "setTimeout(0)",
                data: [],
                borderColor: "rgb(255, 99, 132)",
                backgroundColor: "rgba(255, 99, 132,0.5)",
              },
            ],
          },
          options: {
            responsive: true,

            scales: {
              x: {
                type: "linear",
                position: "bottom",
              },
            },
          },
        });

        // Hook elements to state
        shouldSample.checked = getShouldSample() ? "checked" : "";
        autoIncr.checked = getAutoIncr() ? "checked" : "";
        maxBoxCountInput.max = MAX_MAX_BOX_COUNT;
        maxBoxCountInput.value = DEFAULT_MAX_BOX_COUNT;

        const updateChart = _.throttle(() => {
          const requestSamples = getRequestSamples();
          const timeoutSamples = getTimeoutSamples();
          console.log("samples length", requestSamples.length);
          chart.data.datasets.filter(
            (it) => it.label === "requestAnimationFrame"
          )[0].data = requestSamples;
          chart.data.datasets.filter(
            (it) => it.label === "setTimeout(0)"
          )[0].data = timeoutSamples;

          chart.update();
        }, 1000);

        subRequestSamples(fpsCanvas, updateChart);

        subShouldSample("log", (v) =>
          console.log("should sample:", v ? "enabled" : "disabled")
        );
        subAutoIncr("log", (v) =>
          console.log("auto-incr:", v ? "enabled" : "disabled")
        );

        boxCountInput.min =
          boxCountInput2.min =
          maxBoxCountInput.min =
            MIN_BOX_COUNT;

        subMaxBoxCount(boxCountInput, (v) => {
          boxCountInput.max = v;
        });

        subMaxBoxCount(labelText, (v) => {
          labelText.textContent = `${MIN_BOX_COUNT.toLocaleString(
            "en"
          )} to ${v.toLocaleString("en")}`;
        });

        subMaxBoxCount(
          boxCountInput2,
          (v) => (boxCountInput2.max = getBoxCountScaledMedium(v))
        );

        subMaxBoxCount(
          maxBoxCountLabel,
          (v) => (maxBoxCountLabel.textContent = v.toLocaleString("en"))
        );

        subMaxBoxCount(labelText2, (v) => {
          labelText2.textContent = `${MIN_BOX_COUNT.toLocaleString(
            "en"
          )} to ${getBoxCountScaledMedium(v).toLocaleString("en")}`;
        });

        subBoxCount(boxCountInput, (v) => (boxCountInput.value = v));
        subBoxCount(
          boxCountInput2,
          (v) => (boxCountInput2.value = Math.min(boxCountInput2.max, v))
        );
        subBoxCount(boxCountLabel, (v) => (boxCountLabel.textContent = v));

        // init run
        updateBoxCount(null, getBoxCount());
        updateMaxBoxCount(null, DEFAULT_MAX_BOX_COUNT);

        // Both canvas contexts for each of our rendering techniques
        const ctxRequest = request.getContext("2d");
        const ctxTimeout = timeout.getContext("2d");

        // Generic render logic from context and frame delta time
        const render = (canvasId, active, ctx, delta, nextFrame, sampler) => {
          if (active) {
            let { width, height } = ctx.canvas;

            // Draw background
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, width, height);

            let boxCount = getBoxCount();
            // Draw some bs to make shit lag
            for (let index = 0; index < boxCount; index++) {
              ctx.fillStyle = `#${Math.round(
                Math.random() * MAX_COLOR
              ).toString(16)}`;
              ctx.fillRect(
                Math.random() * (width - width * 0.2 - BLOCK_SIZE) +
                  width * 0.1,
                Math.random() * (height - height * 0.2 - BLOCK_SIZE) +
                  height * 0.1,
                BLOCK_SIZE,
                BLOCK_SIZE
              );
            }

            // Draw framerate

            let framerateValue = 0;
            if (delta !== 0) {
              // display framerate with 1 decimal place
              framerateValue = (ONE_SECOND_IN_MS / delta).toFixed(1);
            }
            let framerateText = `${framerateValue} fps`;

            // console.info("Framerate (FPS) for canvas", canvasId, ": ", framerate);

            // draw framerate
            ctx.fillStyle = "rgba(255, 255, 0, 1)";
            ctx.fillRect(MARGIN, MARGIN, FONT_SIZE * 5 + 2, FONT_SIZE + 2 * 2);

            ctx.fillStyle = "black";
            ctx.font = `${FONT_SIZE}px monospace `;
            ctx.fillText(framerateText, MARGIN, FONT_SIZE + MARGIN);
            if (getShouldSample()) {
              sampler(framerateValue, boxCount);
            }
          }
          nextFrame();
        };

        // Render using the `requestAnimationFrame` method
        let lastTime = 0;
        let requestSample = _.throttle((framerate, boxCount) => {
          const samples = getRequestSamples();
          if (samples.length >= MAX_SAMPLES) return;
          samples.push({ y: Math.round(framerate), x: boxCount });
          updateRequestSamples("requestSampler", getRequestSamples());
        }, MEASURE_INTERVAL_MS);
        const loopRequest = (time) => {
          // delta (in ms)
          const delta = time - lastTime;
          render(
            "requestAnimationFrame",
            window.playRequest.checked,
            ctxRequest,
            delta,
            () => requestAnimationFrame(loopRequest),
            requestSample
          );
          lastTime = time;
        };

        loopRequest(0);

        // Render using the `setTimeout` method
        let timeoutLastTime = Date.now();
        let timeoutSampler = _.throttle((framerate, boxCount) => {
          const samples = getTimeoutSamples();
          if (samples.length >= MAX_SAMPLES) return;
          samples.push({ y: Math.round(framerate), x: boxCount });
          updateTimeoutSamples("timeoutSampler", getTimeoutSamples());
        }, MEASURE_INTERVAL_MS);
        const loopTimeout = (time) => {
          let delta = time - timeoutLastTime;
          render(
            "timeout",
            window.playTimeout.checked,
            ctxTimeout,
            delta,
            () => setTimeout(() => loopTimeout(Date.now()), 0),
            timeoutSampler
          );
          timeoutLastTime = time;
        };
        loopTimeout(Date.now());

        // start box count increment step
        let interval = setInterval(() => {
          if (!getAutoIncr()) return;
          const bc = getBoxCount();
          let boxCount = (bc + MEASURE_INTERVAL_BOX) % getMaxBoxCount();
          updateBoxCount(null, boxCount);
        }, MEASURE_INTERVAL_MS);
      });
    </script>
  </head>
  <body class="bg-neutral-100 px-2">
    <main class="mx-auto container px-4 mt-2 bg-white p-5 rounded-lg border shadow-sm">
      <h1 class="text-3xl font-bold mb-3">TESTING MAX SPEEEEED 🤪</h1>
      <hr class="my-2"/>
      <div >
        <p class="font-bold mb-3">🟦 Box count:</p>
        <label for="boxCountInput" class="block">
          <span class="min-w-[15ch] inline-block" id="labelText"
            >1 to 1,000,000</span
          >
          <input
            class="max-w-96 w-full"
            type="range"
            name="boxCountInput"
            id="boxCountInput"
            min="0"
            max="10000"
            step="50"
            oninput="updateBoxCount(this,Number(this.value))"
          />
        </label>
        <label for="boxCountInput2" class="block">
          <span class="min-w-[15ch] inline-block" id="labelText2">
            1 to 10,000</span
          >
          <input
            class="max-w-96 w-full"
            type="range"
            name="boxCountInput2"
            id="boxCountInput2"
            min="0"
            max="100"
            step="50"
            oninput="updateBoxCount(this,Number(this.value))"
          />
        </label>
        <label for="smallBoxCountInput" class="block">
          <span class="min-w-[15ch] inline-block" id="labelTextSmall">
            1 to 100</span
          >
          <input
            class="max-w-96 w-full"
            type="range"
            name="smallBoxCountInput"
            id="smallBoxCountInput"
            min="0"
            max="100"
            step="1"
            oninput="updateBoxCount(this,Number(this.value))"
          />
        </label>
        <span class="font-bold my-3">Current box count:</span>

        <span class="inline-block px-2 border-2 border-emerald-200 bg-emerald-100 text-emerald-900 rounded font-bold" id="boxCountLabel"
          >NUMBER OF BOXES DRAWN FOR A FRAME</span
        >
        <hr class="my-2"/>
        <label for="boxCount" class="block">
          <span class="min-w-[15ch] inline-block"> 🔥 Max box count</span>
          <input
            class="max-w-96 w-full"
            type="range"
            name="maxBoxCountInput"
            id="maxBoxCountInput"
            min="0"
            max="100"
            step="50"
            oninput="updateMaxBoxCount(this,Number(this.value))"
          />
        </label>
        Current max box count:
        <span class="inline-block px-2 border-2 border-emerald-200 bg-emerald-100 text-emerald-900 rounded font-bold" id="maxBoxCountLabel"
          >NUMBER OF BOXES DRAWN FOR A FRAME</span
        >
      </div>
      <hr class="my-2"/>

      <div class="articles flex gap-3 flex-wrap">
        <article>
          <label class="mb-3 text-xl">
            <input
              type="checkbox"
              name="playRequest"
              id="playRequest"
              checked="checked"
            />
            <code>requestAnimationFrame</code>
          </label>

          <div class="border shadow-sm p-2 rounded-sm bg-white m-2 aspect-square max-w-max">
            <canvas class="aspect-square w-full" width="500" height="500" id="request"></canvas>
          </div>
        </article>
        <article>
          <label class="mb-3 text-xl">
            <input
              type="checkbox"
              name="playTimeout"
              id="playTimeout"
              checked="checked"
            />
            <code>setTimeout(0)</code></label
          >
          <div class="border p-2 shadow-sm bg-white rounded-sm m-2 aspect-square max-w-max">
            <canvas class="aspect-square w-full" width="500" height="500" id="timeout"></canvas>
          </div>
        </article>
      </div>
      <hr class="my-2"/>
      <div class="statistics">
        <h2 class="text-2xl font-bold mb-3">Statistics 📊</h2>
        <label for="shouldSample" class="block">
          Enable sampling:
          <input
            type="checkbox"
            name="shouldSample"
            id="shouldSample"
            oninput="updateShouldSample(this, this.checked)"
          />
        </label>
        <label for="autoIncr" class="block">
          Enable auto-increment box count:
          <input
            type="checkbox"
            name="autoIncr"
            id="autoIncr"
            oninput="updateAutoIncr(this, this.checked)"
          />
        </label>
        <div
          class="mx-auto mb-10 bg-slate-50 p-5 rounded-lg border shadow-sm aspect-video my-3"
          id="statistics"
          style="
            position: relative;
            max-width: 100%;
          "
        >
          <canvas id="fpsCanvas"></canvas>
        </div>
      </div>
    </main>
  </body>
</html>
